name: HeldenMobil Lab Isolation Bootstrap

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  isolate-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply lab isolation
        run: node scripts/lab-isolate.mjs
      - name: Test isolated lab
        run: npm test
      - name: Commit isolated lab baseline
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/app.js index.html README.md package.json tests/smoke.mjs tests/lab-isolation.mjs
          if git diff --cached --quiet; then
            echo "Lab isolation already applied."
          else
            git commit -m "Lab: isolate browser data and disable production cloud sync"
            git push origin HEAD:main
          fi
